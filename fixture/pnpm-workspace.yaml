allowBuilds:
  better-sqlite3: true
  isolated-vm: true
  bufferutil: true
  utf-8-validate: true
  esbuild: true
  core-js: false
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@atproto-labs/opentelemetry-node@0.3.1'
  - '@atproto/api@0.24.0'
  - '@atproto/bsky@0.1.4'
  - '@atproto/bsync@0.1.3'
  - '@atproto/dev-env@0.6.14'
  - '@atproto/ozone@0.6.0'
  - '@atproto/pds@0.5.38'
  - nodemailer@10.0.16

# Fixture is isolated test infrastructure. Overrides patch transitive CVEs
# that dep-review flags on PRs. Remove when upstream pins a safe version.
# - @hapi/content <6.0.3: GHSA-8494-f6mr-cjpv (quadratic-time DoS in parser)
# - follow-redirects <1.16.2: GHSA-mrwp-f3q8-3g9p (cross-realm credential leak)
# - systeminformation <5.33.16: GHSA-3f7j-7jwc-fxfj (Windows cmd injection; N/A on Linux)
# - zod <4.6.6: GHSA-mrhx-c7xc-m3w5 (DoS via oversized collection validation)
# - undici <6.29.1: multiple CVEs (DoS, TLS cert bypass, cache poisoning)
# - nodemailer <10.1.4: GHSA-8c8m-p3m8-cjg8, GHSA-m943-m63m-w62w, GHSA-85x2-q946-cp5h
# - qs <=6.16.0: GHSA-6pq8-jhm2-2vcw (DoS via arrayFormat comma)
# - glob <=14.0.1: GHSA-3g3m-2fjr-6pw4 (AbortSignal bypass)
# - minimatch <11.0.1: GHSA-g3hv-75wg-m249 (globparts DoS)
overrides:
  '@fastify/busboy': '3.2.2'
  'sharp': '0.35.5'
  'kysely': '0.29.6'
  'nodemailer@<10.1.4': '10.1.4'
  'undici@<6.29.1': '6.29.1'
  '@hapi/content@<6.0.3': '6.0.3'
  'follow-redirects@<1.16.2': '1.16.2'
  'systeminformation@<5.33.16': '5.33.16'
  'zod@<4.6.6': '4.6.6'
  'qs@<=6.16.0': '6.16.1'
  'glob@<=14.0.1': '14.0.2'
  'minimatch@<11.0.1': '11.0.1'
  '@opentelemetry/propagator-jaeger': '2.12.0'
  '@opentelemetry/instrumentation-cassandra-driver': '0.66.0'
  '@opentelemetry/instrumentation-knex': '0.65.0'
  '@opentelemetry/instrumentation-mongoose': '0.67.0'
  '@opentelemetry/instrumentation-mysql': '0.67.0'
  '@opentelemetry/instrumentation-mysql2': '0.67.0'
  '@opentelemetry/instrumentation-oracledb': '0.46.0'
  '@opentelemetry/instrumentation-pg': '0.73.0'
  '@opentelemetry/instrumentation-tedious': '0.40.0'
